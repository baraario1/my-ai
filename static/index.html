8px<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>baraa ai</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6d5efc">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f7f6f3;--surface:#fff;--text:#1c1b19;--muted:#7a776f;--accent:#6d5efc;--accent2:#a06bff;--bubble:#ecebe6;--border:#e4e2db;--shadow:0 8px 30px rgba(30,20,80,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1c1c20;--text:#ececf1;--muted:#8d8d98;--bubble:#26262c;--border:#2e2e36;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--surface:#1c1c20;--text:#ececf1;--muted:#8d8d98;--bubble:#26262c;--border:#2e2e36;--shadow:0 8px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:100%;max-width:720px;height:100%}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;backdrop-filter:blur(12px)}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;color:#fff;font-size:18px}
.title{font-weight:700;font-size:16px}
.sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sub i{width:7px;height:7px;border-radius:50%;background:#35c46a;display:inline-block}
main{flex:1;overflow-y:auto;padding:8px 16px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.hero{margin:auto;text-align:center;padding:20px}
.hero h1{font-size:26px;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:14px;margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s}
.chip:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.msg{max-width:85%;padding:12px 16px;border-radius:20px;line-height:1.7;font-size:15px;white-space:pre-wrap;word-wrap:break-word;animation:in .25s ease}
.msg.user{align-self:flex-start;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-end;background:var(--bubble);border-bottom-left-radius:6px}
.dots{display:inline-flex;gap:4px}.dots span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.composer{padding:10px 14px 14px}
.box{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:26px;padding:8px 8px 8px 12px;box-shadow:var(--shadow)}
textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;font-size:15px;line-height:1.5;max-height:140px;padding:8px 6px}
.send{width:42px;height:42px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center;transition:opacity .2s,transform .15s}
.send:disabled{opacity:.4;cursor:default}.send:not(:disabled):active{transform:scale(.92)}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="logo">✦</div>
<div><div class="title">reno</div><div class="sub"><i></i>متصل</div></div>
</header>
<main id="chat">
<div class="hero" id="hero">
<h1>اهلا انا مساعد براء الذكي،كيف بقدر اساعدك؟</h1>
<p>اسألني أي شي، أنا هنا.</p>
<div class="chips">
<button class="chip">اشرح لي فكرة بسيطة</button>
<button class="chip">ساعدني أكتب رسالة</button>
<button class="chip">اقترح لي أفكار</button>
<button class="chip">لخّص لي نص</button>
</div>
</div>
</main>
<div class="composer">
<div class="box">
<textarea id="in" rows="1" placeholder="اكتب رسالتك..."></textarea>
<button class="send" id="send" disabled aria-label="إرسال">↑</button>
</div>
<div class="note">قد يخطئ الذكاء الاصطناعي، تحقق من المعلومات المهمة.</div>
</div>
</div>
<script>
const chat=document.getElementById("chat"),inp=document.getElementById("in"),btn=document.getElementById("send"),hero=document.getElementById("hero");
let history = [];
let busy = false;

try {
  const saved = localStorage.getItem("baraa_ai_history");
  if (saved) {
    history = JSON.parse(saved);
    if (!Array.isArray(history)) history = [];
  }
} catch {
  history = [];
}

function saveHistory() {
  localStorage.setItem("baraa_ai_history", JSON.stringify(history));
}
function check(){btn.disabled=busy||!inp.value.trim()}
inp.addEventListener("input",()=>{inp.style.height="auto";inp.style.height=inp.scrollHeight+"px";check()});
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});
btn.onclick=go;
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{inp.value=c.textContent;go()});
function add(cls,txt){const d=document.createElement("div");d.className="msg "+cls;d.textContent=txt;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function go(){
const t=inp.value.trim();if(!t||busy)return;
hero.remove();inp.value="";inp.style.height="auto";busy=true;check();
add("user",t);
history.push({role:"user",content:t});
saveHistory();

const b=add("bot","");b.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
try{
const res=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:history})});
const data=await res.json();
if(!res.ok){const er=new Error();er.userMsg=data.error;throw er}
b.textContent=data.reply;history.push({role:"assistant",content:data.reply});
saveHistory();
}catch(e){
b.textContent=e.userMsg||"صار خطأ، جرّب مرة ثانية.";
history.pop();
}
busy=false;check();inp.focus();
}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
